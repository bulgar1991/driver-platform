<header class="site-header__bar">
  <div class="site-header__inner">
    <a
      class="site-header__brand"
      routerLink="/"
      i18n-aria-label
      aria-label="Magnus Drive home">
      <app-logo />
    </a>

    <nav class="site-header__nav" i18n-aria-label aria-label="Main">
      @for (p of pages; track p.path) {
        <a
          class="site-header__link"
          [routerLink]="p.path"
          routerLinkActive="site-header__link--active"
          >{{ p.label }}</a
        >
      }
    </nav>

    <div class="site-header__actions">
      <app-language-switch class="site-header__languages" />
      <a appButton size="sm" class="site-header__book" routerLink="/book" i18n
        >Book a ride</a
      >
      <button
        type="button"
        class="site-header__toggle"
        [attr.aria-expanded]="open()"
        aria-controls="site-menu"
        [attr.aria-label]="open() ? menuLabels.close : menuLabels.open"
        (click)="open.set(!open())">
        <app-icon [name]="open() ? 'close' : 'menu'" />
      </button>
    </div>
  </div>

  @if (open()) {
    <nav
      id="site-menu"
      class="site-header__menu"
      i18n-aria-label
      aria-label="Main">
      @for (p of pages; track p.path; let i = $index) {
        <a
          class="site-header__menu-link"
          [style.--i]="i"
          [routerLink]="p.path"
          routerLinkActive="site-header__menu-link--active"
          >{{ p.label }}</a
        >
      }
      <a appButton [block]="true" routerLink="/book" i18n>Book a ride</a>
      <app-language-switch variant="menu" class="site-header__menu-languages" />
    </nav>
  }
</header>
