<span class="car-loader__scene" aria-hidden="true">
  <svg class="car-loader__svg" viewBox="0 0 120 48" focusable="false">
    <defs>
      <linearGradient id="car-loader-beam" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#C9A45C" stop-opacity="0.55" />
        <stop offset="1" stop-color="#C9A45C" stop-opacity="0" />

    </defs>
    <g class="car-loader__city">
      <path
        d="M0 30 L6 30 L6 24 L10 24 L10 27 L16 27 L16 20 L20 20 L20 26 L27 26 L27 22 L33 22 L33 28 L40 28 L40 18 L43 16 L46 18 L46 27 L54 27 L54 23 L60 23 L60 29 L68 29 L68 21 L74 21 L74 26 L82 26 L82 19 L86 19 L86 25 L94 25 L94 22 L100 22 L100 28 L108 28 L108 24 L114 24 L114 30 L120 30" />

    <line class="car-loader__speed" x1="6" y1="32" x2="15" y2="32" />

      <path
        class="car-loader__beam"
        d="M104 27 L120 21 L120 35 L104 31 Z"
        fill="url(#car-loader-beam)" />
      <path

        d="M72 16 L80 16 Q82 16 84 18 L88 22 L72 22 Z" />
      <circle class="car-loader__light" cx="102" cy="28" r="1.4" />

    <g class="car-loader__wheel">
      <circle class="car-loader__tyre" cx="40" cy="37" r="6" />
      <line class="car-loader__spoke" x1="36" y1="37" x2="44" y2="37" />
      <line class="car-loader__spoke" x1="40" y1="33" x2="40" y2="41" />

    <g class="car-loader__wheel">
      <circle class="car-loader__tyre" cx="88" cy="37" r="6" />
      <line class="car-loader__spoke" x1="84" y1="37" x2="92" y2="37" />
      <line class="car-loader__spoke" x1="88" y1="33" x2="88" y2="41" />
    </g>
  </svg>
</span>
@if (label(); as text) {
  <span class="car-loader__label">{{ text }}</span>
} @else {
  <span class="sr-only" i18n>Loading…</span>
}
