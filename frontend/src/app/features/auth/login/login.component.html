<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="login__header">
      <app-logo size="lg" />
      <p class="eyebrow"><ng-container i18n>Management panel</ng-container></p>
    </div>

    @if (error(); as message) {
      <p class="alert alert--error" role="alert">{{ message }}</p>
    }

    <app-form-field
      i18n-label
      label="Email"
      for="email"
      [error]="fieldError('email')">
      <input
        id="email"
        class="input"
        [class.input--invalid]="fieldError('email')"
        type="email"
        autocomplete="username"
        formControlName="email" />
    </app-form-field>

    <app-form-field
      i18n-label
      label="Password"
      for="password"
      [error]="fieldError('password')">
      <input
        id="password"
        class="input"
        [class.input--invalid]="fieldError('password')"
        type="password"
        autocomplete="current-password"
        formControlName="password" />
    </app-form-field>

    <button appButton type="submit" [block]="true" [disabled]="submitting()">
      @if (submitting()) {
        <ng-container i18n>Signing in…</ng-container>
      } @else {
        <ng-container i18n>Sign in</ng-container>
      }
    </button>
  </form>
</div>
