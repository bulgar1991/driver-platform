<form class="details-step" (submit)="submit($event)" novalidate>
  <fieldset class="details-step__group" [formGroup]="details()">
    <legend class="details-step__legend" i18n>Options</legend>

    <label class="details-step__toggle">
      <input
        class="details-step__checkbox"
        type="checkbox"
        formControlName="nameSign" />
      <span>
        <ng-container i18n>Name sign in arrivals</ng-container>
        @if (options()?.extras?.NameSign; as price) {
          <span class="details-step__price">+{{ price | money }}</span>
        }
      </span>
    </label>
    @if (details().controls.nameSign.value) {
      <app-form-field
        i18n-label
        label="Name on the sign"
        for="nameSignText"
        [error]="detailsError('nameSignText')">
        <input
          id="nameSignText"
          class="input"
          i18n-placeholder
          placeholder="Your name if left empty"
          formControlName="nameSignText" />
      </app-form-field>
    }

    <app-form-field
      i18n-label
      label="Flight or ship number"
      for="flightNumber"
      [error]="detailsError('flightNumber')">
      <input
        id="flightNumber"
        class="input"
        i18n-placeholder
        placeholder="Optional — we track delays"
        autocomplete="off"
        formControlName="flightNumber" />
    </app-form-field>

    @if (hasReturn()) {
      <label class="details-step__toggle">
        <input
          class="details-step__checkbox"
          type="checkbox"
          formControlName="returnNameSign" />
        <span i18n>Name sign on the return trip</span>
      </label>
      <app-form-field
        i18n-label
        label="Return flight or ship number"
        for="returnFlightNumber"
        [error]="detailsError('returnFlightNumber')">
        <input
          id="returnFlightNumber"
          class="input"
          autocomplete="off"
          formControlName="returnFlightNumber" />
      </app-form-field>
    }

    <app-form-field i18n-label label="Notes for the driver" for="notes">
      <textarea
        id="notes"
        class="input details-step__notes"
        rows="3"
        formControlName="notes"></textarea>
    </app-form-field>
  </fieldset>

  <fieldset class="details-step__group" [formGroup]="contact()">
    <legend class="details-step__legend" i18n>Your details</legend>
    <div class="details-step__row">
      <app-form-field
        i18n-label
        label="First name"
        for="firstName"
        [error]="contactError('firstName')">
        <input
          id="firstName"
          class="input"
          autocomplete="given-name"
          formControlName="firstName" />
      </app-form-field>
      <app-form-field
        i18n-label
        label="Last name"
        for="lastName"
        [error]="contactError('lastName')">
        <input
          id="lastName"
          class="input"
          autocomplete="family-name"
          formControlName="lastName" />
      </app-form-field>
    </div>
    <div class="details-step__row">
      <app-form-field
        i18n-label
        label="Email"
        for="email"
        [error]="contactError('email')">
        <input
          id="email"
          class="input"
          type="email"
          autocomplete="email"
          formControlName="email" />
      </app-form-field>
      <app-form-field
        i18n-label
        label="Mobile phone"
        for="phone"
        [error]="contactError('phone')">
        <input
          id="phone"
          class="input"
          type="tel"
          autocomplete="tel"
          placeholder="+39 …"
          formControlName="phone" />
      </app-form-field>
    </div>

    <label class="details-step__toggle">
      <input
        class="details-step__checkbox"
        type="checkbox"
        formControlName="gdprConsent" />
      <span i18n>
        I agree that my details are used to arrange this ride, as described in
        the
        <a class="details-step__link" routerLink="/privacy" target="_blank"
          >privacy policy</a
        >, and to the
        <a class="details-step__link" routerLink="/terms" target="_blank"
          >terms of service</a
        >.
      </span>
    </label>
    @if (contactError('gdprConsent')) {
      <p class="details-step__error" role="alert" i18n
        >Please accept to continue.</p
      >
    }
    <label class="details-step__toggle">
      <input
        class="details-step__checkbox"
        type="checkbox"
        formControlName="marketingConsent" />
      <span i18n>Send me occasional offers (optional).</span>
    </label>
  </fieldset>

  <div class="details-step__actions">
    <button appButton type="button" variant="ghost" (click)="back.emit()">
      <ng-container i18n>Change car</ng-container>
    </button>
    <button appButton type="submit" [disabled]="loading() || !vehicle()">
      @if (loading()) {
        <ng-container i18n>Booking…</ng-container>
      } @else {
        <ng-container i18n
          >Book and pay ·
          {{
            vehicle()?.total | money // i18n(ph="total")
          }}</ng-container
        >
      }
    </button>
  </div>
</form>
