<div class="trip-step" [formGroup]="form()">
  <div class="trip-step__route">
    <app-form-field
      label="From"
      for="pickup"
      [error]="invalid('pickup') ? 'Pick an address from the list' : null">
      <app-address-input
        inputId="pickup"
        placeholder="Airport, station, hotel, address…"
        formControlName="pickup"
        [invalid]="invalid('pickup')" />
    </app-form-field>
    <button
      type="button"
      class="trip-step__swap"
      aria-label="Swap from and to"
      (click)="swap()">
      <app-icon name="route" />
    </button>
    <app-form-field
      label="To"
      for="dropoff"
      [error]="invalid('dropoff') ? 'Pick an address from the list' : null">
      <app-address-input
        inputId="dropoff"
        placeholder="Where are you going?"
        formControlName="dropoff"
        [invalid]="invalid('dropoff')" />
    </app-form-field>
  </div>

  <div class="trip-step__details">
    <div class="trip-step__when">
      <app-form-field label="Date" for="date">
        <input
          id="date"
          class="input"
          type="date"
          [min]="minDate"
          formControlName="date" />
      </app-form-field>
      <app-form-field label="Pickup time (Italy)" for="time">
        <input id="time" class="input" type="time" formControlName="time" />
      </app-form-field>
    </div>
    <div class="trip-step__counters">
      <app-counter
        label="Passengers"
        [min]="1"
        [max]="8"
        formControlName="passengers" />
      <app-counter
        label="Large bags"
        hint="Suitcases"
        [max]="16"
        formControlName="largeLuggage" />
      <app-counter
        label="Small bags"
        hint="Carry-on"
        [max]="16"
        formControlName="smallLuggage" />
    </div>
  </div>

  <label class="trip-step__toggle">
    <input
      class="trip-step__checkbox"
      type="checkbox"
      formControlName="returnTrip" />
    <span>
      Add a return trip
      @if (options()?.returnDiscountPercent; as discount) {
        <span class="trip-step__badge">−{{ discount }}%</span>
      }
    </span>
  </label>

  @if (form().controls.returnTrip.value) {
    <div class="trip-step__return">
      <app-form-field
        label="Return date"
        for="returnDate"
        [error]="returnMissing ? 'Enter the return date and time' : null">
        <input
          id="returnDate"
          class="input"
          type="date"
          [min]="form().controls.date.value || minDate"
          formControlName="returnDate" />
      </app-form-field>
      <app-form-field label="Return pickup time" for="returnTime">
        <input
          id="returnTime"
          class="input"
          type="time"
          formControlName="returnTime" />
      </app-form-field>
    </div>
  }
</div>
