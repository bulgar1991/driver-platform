<section
  class="services-section"
  [class.services-section--page]="page()"
  i18n-aria-label
  aria-label="Our services">
  <div class="page page__section">
    <app-section-heading
      i18n-eyebrow
      eyebrow="What we do"
      i18n-title
      title="Our Services"
      [level]="page() ? 1 : 2"
      appReveal />
    <ul class="services-section__grid">
      @for (service of services(); track service.title; let i = $index) {
        <li class="services-section__item" appReveal [delay]="i * 110">
          <app-service-card [service]="service" />
        </li>
      }
    </ul>
    <p class="services-section__more" appReveal [delay]="450">
      @if (more()) {
        <a class="services-section__link" routerLink="/services" i18n
          >All services →</a
        >
      } @else {
        <a class="services-section__link" routerLink="/tariffs" i18n
          >See our tariffs →</a
        >
      }
    </p>
  </div>
</section>
